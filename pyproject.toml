[project]
name = "sanitise"
version = "0.1.0"
description = "Privacy-preserving RAG - Agent 1 (Sensitive Information Detector)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanitise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["presidio: needs presidio-analyzer and the en_core_web_lg spaCy model"]

[tool.ruff]
line-length = 100
